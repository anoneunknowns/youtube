<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Num-Num Numbers — Binary Count mockup</title>
  <style>
    @font-face {
      font-family: "M Plus Rounded";
      src: url("../../../assets/library/render-sources/counting-garden/v001/MPLUSRounded1c-Black.ttf") format("truetype");
      font-weight: 900;
      font-style: normal;
      font-display: block;
    }
    :root {
      --ink: #563718;
      --muted-ink: #79644f;
      --teal: #257d8c;
      --gold: #ffcf58;
      --lavender: #ddd5ef;
      font-family: "M Plus Rounded", sans-serif;
      font-weight: 900;
      color: var(--ink);
    }
    * { box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; }
    body { background: #d2d6e7; }
    #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; isolation: isolate; }
    .garden { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; z-index: -3; }
    .garden-wash { position: absolute; inset: 0; z-index: -2; background: linear-gradient(180deg, #e5e8ff25 0%, #e5e8ff08 65%, #dce3ee24 100%); }
    .series-name { position: absolute; left: 65px; top: 40px; font-size: 38px; line-height: 1.25; letter-spacing: -.8px; text-shadow: 0 2px 0 #ffffffad; }
    .series-name .num { color: #7652a0; }
    .series-name::after { content: ""; display: block; margin-top: 10px; width: 85px; height: 7px; border-radius: 8px; background: #eec764; }
    .title-pill { position: absolute; left: 890px; top: 39px; width: 680px; height: 117px; border: 5px solid #b6a3cc; border-radius: 42px; background: #fff9eefa; box-shadow: 0 7px 0 #a89abd55; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; }
    .title-pill h1 { font-size: 38px; letter-spacing: 3px; line-height: 1.12; margin: 0; }
    .series-range { font-size: 27px; line-height: 1.2; letter-spacing: 1px; color: #7a5c85; }
    .series-range sub { font-size: .65em; vertical-align: -.2em; }
    .scene-tag { position: absolute; left: 880px; top: 176px; width: 700px; height: 44px; display: flex; justify-content: center; align-items: center; font-size: 26px; line-height: 1; color: #356c79; letter-spacing: 2px; text-align: center; }
    .scene-tag span { display: inline-flex; height: 44px; align-items: center; justify-content: center; padding: 0 27px; border-radius: 23px; border: 3px solid #cadad9; background: #fffdf1f5; }
    .scene-tag[hidden] { display: none; }
    .bear-shadow { position: absolute; left: 180px; top: 866px; width: 270px; height: 34px; border-radius: 50%; background: #504c7130; z-index: 0; }
    .bear-canonical { position: absolute; left: -33.6px; top: 218.84px; width: 702.24px; height: 702.24px; z-index: 1; }
    .bear-stretch { position: absolute; overflow: hidden; z-index: 1; }
    .bear-stretch img { position: absolute; max-width: none; }
    .bear-canonical[hidden], .bear-stretch[hidden] { display: none; }
    .board { position: absolute; left: 610px; top: 228px; width: 1240px; height: 580px; border: 8px solid #b88d56; border-radius: 48px; background: #fff8eafa; box-shadow: 0 12px 0 #856a5f40, inset 0 0 0 5px #ffe5ad; }
    .board h2 { position: absolute; left: 0; top: 24px; width: 1224px; height: 48px; margin: 0; text-align: center; line-height: 48px; font-size: 34px; letter-spacing: 6px; }
    .bit-grid { position: absolute; left: 32px; top: 94px; width: 1160px; height: 234px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 14px; }
    .bit-cell { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 4px solid #baadd0; border-radius: 29px; background: var(--lavender); box-shadow: inset 0 5px 0 #ffffff75, 0 6px 0 #9d8bb329; }
    .bit-cell.on { background: linear-gradient(#ffdd7d, #ffcd51); border-color: #d7a13a; box-shadow: inset 0 5px 0 #fff3b2, 0 0 23px #ffcc5960, 0 6px 0 #a87f3b29; }
    .bit-cell.unused { background: #eee7df3d; border: 3px dashed #b9aec53b; box-shadow: none; }
    .bit-cell.focused { outline: 7px solid var(--teal); outline-offset: 4px; }
    .bit-value { width: 100%; height: 160px; flex: 0 0 160px; display: block; font-size: 116px; line-height: 1; color: #573411; font-variant-numeric: tabular-nums; }
    .place-weight { width: 100%; height: 39px; margin-top: 0; display: flex; align-items: center; justify-content: center; font-size: 30px; line-height: 1; color: #69523f; }
    .unused .bit-value { visibility: hidden; }
    .unused .place-weight { color: #968a9b60; }
    .weight-caption { position: absolute; top: 345px; left: 0; width: 1224px; font-size: 20px; line-height: 1.2; text-align: center; letter-spacing: 3px; color: #8a7463; }
    .board-rule { position: absolute; left: 40px; top: 385px; width: 1144px; height: 3px; border-radius: 4px; background: #c5ae8a75; }
    .everyday { position: absolute; left: 0; top: 401px; width: 1224px; height: 61px; display: flex; align-items: center; justify-content: center; gap: 20px; }
    .everyday-label { font-size: 27px; color: #806c55; line-height: 1; letter-spacing: 1.5px; }
    .everyday-value { font-size: 49px; line-height: 1; font-variant-numeric: tabular-nums; }
    .say { position: absolute; left: 32px; top: 478px; width: 1160px; height: 58px; display: flex; align-items: center; justify-content: center; gap: 14px; white-space: nowrap; }
    .say-label { font-size: 28px; color: #826a53; }
    .spoken-words { display: flex; align-items: center; justify-content: center; gap: 9px; font-size: 32px; line-height: 1.2; }
    .spoken-word { border-radius: 12px; padding: 7px 6px; }
    .spoken-word.focused { background: #d5edeb; color: #236575; box-shadow: inset 0 -4px 0 #64a9af; }
    .below-board { position: absolute; left: 610px; top: 831px; width: 1240px; height: 55px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 31px; line-height: 1.2; }
    .below-board .text-card { padding: 6px 25px 8px; border-radius: 23px; background: #fffaf0e8; box-shadow: 0 3px 0 #a797af30; }
    .below-board.equation { top: 820px; height: 75px; font-size: 43px; letter-spacing: 2px; }
    .legend { display: flex; justify-content: center; align-items: center; gap: 35px; }
    .legend-item { display: flex; align-items: center; gap: 12px; padding: 9px 19px; border-radius: 20px; background: #fffaf0ee; font-size: 27px; line-height: 1; }
    .legend-swatch { width: 29px; height: 29px; border: 3px solid #a497b5; border-radius: 9px; background: var(--lavender); }
    .legend-swatch.on { background: var(--gold); border-color: #d7a13a; box-shadow: 0 0 12px #ffce65a0; }
    .progress-caption { position: absolute; left: 74px; top: 900px; font-size: 22px; letter-spacing: 2px; line-height: 1; color: #665275; text-shadow: 0 2px 0 #fff9; }
    .progress { position: absolute; left: 74px; top: 935px; width: 1772px; height: 111px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 18px; }
    .range-plaque { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; border: 3px solid #a695b6; border-radius: 24px; background: #fff8eef0; box-shadow: 0 6px 0 #75647c25; }
    .range-plaque.active { border: 5px solid #337f88; background: #fff1bd; box-shadow: 0 6px 0 #28667333; }
    .range-plaque.active::before { content: ""; position: absolute; width: 37px; height: 6px; top: -5px; border-radius: 0 0 8px 8px; background: #337f88; }
    .range-plaque .digit-count { font-size: 28px; line-height: 1; color: #6a526d; }
    .range-plaque .binary-range { font-size: 22px; line-height: 1; letter-spacing: -.45px; color: #6c4f32; white-space: nowrap; }
    .range-plaque.active .digit-count { color: #286a73; }
  </style>
</head>
<body>
  <main id="stage" aria-label="Binary counting educational video mockup">
    <img class="garden" src="../../../assets/library/worlds/binary-lantern-garden/backgrounds/v001/lantern-garden-background.png" alt="A quiet lantern garden in the early evening">
    <div class="garden-wash" aria-hidden="true"></div>
    <div class="series-name"><span class="num">Num-Num</span> Numbers</div>
    <header class="title-pill">
      <h1>BINARY COUNT</h1>
      <div class="series-range">0 → 1111111<sub>2</sub></div>
    </header>
    <div class="scene-tag" id="scene-tag" hidden><span></span></div>
    <div class="bear-shadow" aria-hidden="true"></div>
    <img class="bear-canonical" id="bear-canonical" src="../../../assets/library/characters/bear-beret/references/canonical-neutral-v001.png" alt="The yellow bear in a red beret">
    <div class="bear-stretch" id="bear-stretch" hidden aria-label="The same bear stretching while seated" role="img">
      <img src="../../../assets/library/characters/bear-beret/animations/postures/v001/postures-sheet.png" alt="">
    </div>
    <section class="board" aria-labelledby="binary-label">
      <h2 id="binary-label">BINARY</h2>
      <div class="bit-grid" id="bit-grid"></div>
      <div class="weight-caption">PLACE VALUE</div>
      <div class="board-rule" aria-hidden="true"></div>
      <div class="everyday"><span class="everyday-label" id="everyday-label">DECIMAL</span><span class="everyday-value" id="everyday-value"></span></div>
      <div class="say"><span class="say-label" id="say-label">Say:</span><div class="spoken-words" id="spoken-words"></div></div>
    </section>
    <div class="below-board" id="below-board"></div>
    <div class="progress-caption">BINARY RANGES</div>
    <nav class="progress" id="progress" aria-label="Binary digit ranges"></nav>
  </main>
  <script>
    "use strict";
    (() => {
      const params = new URLSearchParams(window.location.search);
      const sceneNames = new Set(["normal", "intro", "carry", "zero", "break", "finale"]);
      const requestedScene = params.get("scene") || "normal";
      const scene = sceneNames.has(requestedScene) ? requestedScene : "normal";
      const fixedNumbers = { intro: 2, carry: 8, zero: 0, break: 31, finale: 127 };
      const rawNumber = params.get("n");
      const requestedNumber = rawNumber !== null && /^\d+$/.test(rawNumber) ? Number(rawNumber) : 45;
      const n = scene === "normal" ? Math.max(0, Math.min(127, requestedNumber)) : fixedNumbers[scene];
      const bits = n.toString(2);
      const tokenwords = Array.from(bits, bit => bit === "1" ? "one" : "zero");
      const weights = [64, 32, 16, 8, 4, 2, 1];
      const rawFocus = params.get("focus");
      const requestedFocus = rawFocus !== null && /^\d+$/.test(rawFocus) ? Number(rawFocus) : (scene === "intro" ? 0 : 2);
      // Focus is a left-to-right index among visible digits, never a place value.
      const focus = scene === "normal" || scene === "intro" ? Math.min(bits.length - 1, requestedFocus) : null;
      const sceneLabels = { normal: "", intro: "HOW TO READ", carry: "A NEW PLACE", zero: "START WITH ZERO", break: "LET'S STRETCH", finale: "SEVEN PLACES" };
      const ranges = ["0–1", "10–11", "100–111", "1000–1111", "10000–11111", "100000–111111", "1000000–1111111"];
      const grid = document.getElementById("bit-grid");
      const visiblecells = [];
      const digitCanvases = [];
      const emptyCount = 7 - bits.length;
      weights.forEach((weight, column) => {
        const digitIndex = column - emptyCount;
        const used = digitIndex >= 0;
        const bit = used ? bits[digitIndex] : null;
        const cell = document.createElement("div");
        cell.className = `bit-cell${used ? (bit === "1" ? " on" : " off") : " unused"}${used && digitIndex === focus ? " focused" : ""}`;
        cell.dataset.column = String(column);
        cell.dataset.weight = String(weight);
        const value = document.createElement("canvas");
        value.className = "bit-value";
        value.textContent = used ? bit : "";
        value.setAttribute("aria-hidden", "true");
        const label = document.createElement("span");
        label.className = "place-weight";
        label.textContent = String(weight);
        cell.append(value, label);
        if (used) {
          cell.setAttribute("aria-label", `${bit}, place value ${weight}`);
          visiblecells.push({ column, digitIndex, bit, weight, word: tokenwords[digitIndex], focused: digitIndex === focus });
          digitCanvases.push({ canvas: value, bit, column });
        } else {
          cell.setAttribute("aria-hidden", "true");
        }
        grid.append(cell);
      });
      const tag = document.getElementById("scene-tag");
      if (sceneLabels[scene]) {
        tag.hidden = false;
        tag.firstElementChild.textContent = sceneLabels[scene];
      }
      document.getElementById("everyday-value").textContent = String(n);
      const everydayLabel = scene === "intro" ? "EVERYDAY NUMBER · DECIMAL" : "DECIMAL";
      document.getElementById("everyday-label").textContent = everydayLabel;
      const words = document.getElementById("spoken-words");
      const sayText = scene === "break" ? "Let's stretch!" : tokenwords.join(" ");
      if (scene === "break") {
        words.textContent = sayText;
        document.getElementById("say-label").hidden = true;
      } else {
        tokenwords.forEach((word, index) => {
          const span = document.createElement("span");
          span.className = `spoken-word${index === focus ? " focused" : ""}`;
          span.textContent = word;
          words.append(span);
        });
      }
      const below = document.getElementById("below-board");
      const captions = { intro: "Read each digit from left to right.", carry: "111 + 1 = 1000", zero: "Zero is off. One is on.", break: "Take a little counting break.", finale: "Seven places, all ones!" };
      if (scene === "normal") {
        const legend = document.createElement("div");
        legend.className = "legend";
        for (const [value, name] of [["0", "OFF"], ["1", "ON"]]) {
          const item = document.createElement("span");
          item.className = "legend-item";
          const swatch = document.createElement("span");
          swatch.className = `legend-swatch${value === "1" ? " on" : ""}`;
          swatch.setAttribute("aria-hidden", "true");
          const text = document.createElement("span");
          text.textContent = `${value} ${name}`;
          item.append(swatch, text);
          legend.append(item);
        }
        below.append(legend);
      } else {
        const caption = document.createElement("span");
        caption.className = "text-card";
        caption.textContent = captions[scene];
        below.append(caption);
        if (scene === "carry") below.classList.add("equation");
      }
      const progress = document.getElementById("progress");
      ranges.forEach((range, index) => {
        const plaque = document.createElement("div");
        const active = index + 1 === bits.length;
        plaque.className = `range-plaque${active ? " active" : ""}`;
        if (active) plaque.setAttribute("aria-current", "step");
        const count = document.createElement("span");
        count.className = "digit-count";
        count.textContent = `${index + 1} ${index === 0 ? "digit" : "digits"}`;
        const binaryRange = document.createElement("span");
        binaryRange.className = "binary-range";
        binaryRange.textContent = range;
        plaque.append(count, binaryRange);
        progress.append(plaque);
      });
      const canonical = document.getElementById("bear-canonical");
      const stretch = document.getElementById("bear-stretch");
      if (scene === "break") {
        const scale = .56 * 696 / 338;
        const cellSize = 627 * scale;
        canonical.hidden = true;
        stretch.hidden = false;
        stretch.style.left = `${315 - 305.5 * scale}px`;
        stretch.style.top = `${883 - 593 * scale}px`;
        stretch.style.width = `${cellSize}px`;
        stretch.style.height = `${cellSize}px`;
        const image = stretch.firstElementChild;
        image.style.width = `${1254 * scale}px`;
        image.style.height = `${1254 * scale}px`;
        image.style.left = `${-cellSize}px`;
        image.style.top = `${-cellSize}px`;
      }
      const state = {
        scene, n, bits, focus, tokenwords,
        labels: { series: "Num-Num Numbers", title: "BINARY COUNT", range: "0 → 1111111₂", scene: sceneLabels[scene], binary: "BINARY", decimal: everydayLabel, decimalValue: String(n), say: sayText, caption: scene === "normal" ? "0 OFF · 1 ON" : captions[scene], progress: ranges.map((range, i) => ({ label: `${i + 1} ${i === 0 ? "digit" : "digits"}`, range, active: i + 1 === bits.length })) },
        weights, visiblecells,
        leadingUnusedSlots: emptyCount,
        bear: scene === "break" ? { source: "postures-sheet.png", region: [627, 627, 627, 627], root: [315, 883], supportAnchor: [305.5, 593], scale: .56 * 696 / 338 } : { source: "canonical-neutral-v001.png", root: [315, 883], supportAnchor: [622.5, 1186], scale: .56 },
        canvas: { width: 1920, height: 1080 },
        productionStatus: "static-preproduction-mockup"
      };
      window.getMockupState = () => structuredClone(state);
      const waitForImage = image => image.complete
        ? (image.naturalWidth > 0 ? image.decode() : Promise.reject(new Error(`Image failed: ${image.getAttribute("src")}`)))
        : new Promise((resolve, reject) => { image.addEventListener("load", () => image.decode().then(resolve, reject), { once: true }); image.addEventListener("error", () => reject(new Error(`Image failed: ${image.getAttribute("src")}`)), { once: true }); });
      const fontsReady = document.fonts.load('900 116px "M Plus Rounded"').then(() => document.fonts.ready);
      const glyphsReady = fontsReady
        .then(() => new Promise(resolve => requestAnimationFrame(resolve)))
        .then(() => {
          digitCanvases.forEach(({ canvas, bit, column }) => {
            const { width, height } = canvas.getBoundingClientRect();
            const pixelRatio = window.devicePixelRatio || 1;
            canvas.width = Math.round(width * pixelRatio);
            canvas.height = Math.round(height * pixelRatio);
            const context = canvas.getContext("2d");
            if (!context || width <= 0 || height <= 0) throw new Error("Digit canvas is unavailable");
            // Match CSS pixels exactly even when a grid track has a fractional width.
            context.setTransform(canvas.width / width, 0, 0, canvas.height / height, 0, 0);
            context.font = '900 116px "M Plus Rounded"';
            context.textAlign = "left";
            context.textBaseline = "alphabetic";
            context.fillStyle = getComputedStyle(canvas).color;
            const metrics = context.measureText(bit);
            const left = metrics.actualBoundingBoxLeft;
            const right = metrics.actualBoundingBoxRight;
            const ascent = metrics.actualBoundingBoxAscent;
            const descent = metrics.actualBoundingBoxDescent;
            if (![left, right, ascent, descent].every(Number.isFinite)) throw new Error("Digit ink metrics are unavailable");
            const x = (width + left - right) / 2;
            const y = (height + ascent - descent) / 2;
            context.fillText(bit, x, y);
            const inkBounds = { left: x - left, right: x + right, top: y - ascent, bottom: y + descent };
            const centerError = { x: (inkBounds.left + inkBounds.right - width) / 2, y: (inkBounds.top + inkBounds.bottom - height) / 2 };
            if (Math.abs(centerError.x) > .5 || Math.abs(centerError.y) > .5) throw new Error("Digit ink center is outside tolerance");
            visiblecells.find(cell => cell.column === column).ink = {
              coordinateSpace: "CSS pixels local to the digit field",
              font: context.font,
              field: { width, height },
              metrics: { left, right, ascent, descent },
              drawOrigin: { x, y },
              bounds: inkBounds,
              centerError
            };
          });
        });
      window.mockupReady = Promise.all([glyphsReady, ...Array.from(document.images, waitForImage)])
        .then(() => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(() => resolve(window.getMockupState())))));
    })();
  </script>
</body>
</html>
